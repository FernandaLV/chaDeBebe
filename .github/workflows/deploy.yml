name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js
        run: |
          echo "// config.js - Configuração gerenciada por GitHub Actions" > lista/js/config.js
          echo "// NÃO EDITE ARQUIVO DIRETAMENTE - altere via GitHub Secrets" >> lista/js/config.js
          echo "" >> lista/js/config.js
          echo "var APP_CONFIG = {" >> lista/js/config.js
          echo "  GOOGLE_SCRIPT_ID: '${{ secrets.GOOGLE_SCRIPT_ID }}'" >> lista/js/config.js
          echo "};" >> lista/js/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'lista'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
